version: '3.7'

networks:
  test:
    name: fabric_test

services:
  # CouchDB for IS org peer0
  couchdb0:
    container_name: couchdb0
    image: couchdb:3.4.2
    labels:
      service: hyperledger-fabric
    environment:
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=adminpw
    ports:
      - "5984:5984"
    networks:
      - test
    healthcheck:
      test: ["CMD", "curl", "-f", "http://admin:adminpw@localhost:5984/_up"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # CouchDB for IS org peer1
  couchdb1:
    container_name: couchdb1
    image: couchdb:3.4.2
    labels:
      service: hyperledger-fabric
    environment:
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=adminpw
    ports:
      - "6984:5984"
    networks:
      - test
    healthcheck:
      test: ["CMD", "curl", "-f", "http://admin:adminpw@localhost:5984/_up"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # CouchDB for CS org peer0
  couchdb2:
    container_name: couchdb2
    image: couchdb:3.4.2
    labels:
      service: hyperledger-fabric
    environment:
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=adminpw
    ports:
      - "7984:5984"
    networks:
      - test
    healthcheck:
      test: ["CMD", "curl", "-f", "http://admin:adminpw@localhost:5984/_up"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # CouchDB for CS org peer1
  couchdb3:
    container_name: couchdb3
    image: couchdb:3.4.2
    labels:
      service: hyperledger-fabric
    environment:
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=adminpw
    ports:
      - "8984:5984"
    networks:
      - test
    healthcheck:
      test: ["CMD", "curl", "-f", "http://admin:adminpw@localhost:5984/_up"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # CouchDB for CS org peer2
  couchdb4:
    container_name: couchdb4
    image: couchdb:3.4.2
    labels:
      service: hyperledger-fabric
    environment:
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=adminpw
    ports:
      - "9984:5984"
    networks:
      - test
    healthcheck:
      test: ["CMD", "curl", "-f", "http://admin:adminpw@localhost:5984/_up"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # IS org peer0 configuration
  peer0.is.example.com:
    environment:
      - CORE_LEDGER_STATE_STATEDATABASE=CouchDB
      - CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS=couchdb0:5984
      - CORE_LEDGER_STATE_COUCHDBCONFIG_USERNAME=admin
      - CORE_LEDGER_STATE_COUCHDBCONFIG_PASSWORD=adminpw
    depends_on:
      couchdb0:
        condition: service_healthy

  # IS org peer1 configuration
  peer1.is.example.com:
    environment:
      - CORE_LEDGER_STATE_STATEDATABASE=CouchDB
      - CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS=couchdb1:5984
      - CORE_LEDGER_STATE_COUCHDBCONFIG_USERNAME=admin
      - CORE_LEDGER_STATE_COUCHDBCONFIG_PASSWORD=adminpw
    depends_on:
      couchdb1:
        condition: service_healthy

  # CS org peer0 configuration
  peer0.cs.example.com:
    environment:
      - CORE_LEDGER_STATE_STATEDATABASE=CouchDB
      - CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS=couchdb2:5984
      - CORE_LEDGER_STATE_COUCHDBCONFIG_USERNAME=admin
      - CORE_LEDGER_STATE_COUCHDBCONFIG_PASSWORD=adminpw
    depends_on:
      couchdb2:
        condition: service_healthy

  # CS org peer1 configuration
  peer1.cs.example.com:
    environment:
      - CORE_LEDGER_STATE_STATEDATABASE=CouchDB
      - CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS=couchdb3:5984
      - CORE_LEDGER_STATE_COUCHDBCONFIG_USERNAME=admin
      - CORE_LEDGER_STATE_COUCHDBCONFIG_PASSWORD=adminpw
    depends_on:
      couchdb3:
        condition: service_healthy

  # CS org peer2 configuration
  peer2.cs.example.com:
    environment:
      - CORE_LEDGER_STATE_STATEDATABASE=CouchDB
      - CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS=couchdb4:5984
      - CORE_LEDGER_STATE_COUCHDBCONFIG_USERNAME=admin
      - CORE_LEDGER_STATE_COUCHDBCONFIG_PASSWORD=adminpw
    depends_on:
      couchdb4:
        condition: service_healthy
